<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Словари</title>
</head>
<body>
<h1>Словари</h1>

<details open>
    <summary>Латинский словарь</summary>

    <div th:if="${latinDictionary == null}">
        Latin dictionary not found
    </div>

    <div th:if="${latinDictionary != null}">
        <div th:each="e : ${latinDictionary.entries}">
            <b th:text="${e.entryKey}">key</b>
            <button type="button" th:attr="data-id=${e.id}" onclick="deleteEntry(this)">
                Delete
            </button>
            <ul>
                <li th:each="v : ${e.values}" th:text="${v.value}">value</li>
            </ul>
        </div>
    </div>
</details>

<details>
    <summary>Цифровой словарь</summary>

    <div th:if="${digitDictionary == null}">
        Digit dictionary not found
    </div>

    <div th:if="${digitDictionary != null}">
        <div th:each="e : ${digitDictionary.entries}">
            <b th:text="${e.entryKey}">key</b>
            <button type="button" th:attr="data-id=${e.id}" onclick="deleteEntry(this)">
                Delete
            </button>
            <ul>
                <li th:each="v : ${e.values}" th:text="${v.value}">value</li>
            </ul>
        </div>
    </div>
</details>
<script>
    async function deleteEntry(btn) {
        const id = btn.getAttribute("data-id");
        const resp = await fetch("/entries/" + id, { method: "DELETE" });
        if (resp.ok) {
            // удаляем блок записи со страницы
            btn.closest("div").remove();
        } else {
            alert("Delete failed");
        }
    }
</script>
</body>
</html>
